spring.application.name=budget-service

server.port=8092

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/civicpulse
spring.datasource.username=postgres
spring.datasource.password=3112
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=false
eureka.instance.hostname=budget-service
eureka.instance.instance-id=${spring.application.name}:${server.port}
# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=budget-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.civicpulse.budget_service.kafka
spring.kafka.consumer.properties.spring.json.value.default.type=com.civicpulse.budget_service.kafka.BenefitIssuedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false