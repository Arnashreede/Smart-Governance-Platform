spring.application.name=user-service

server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/civicpulse
spring.datasource.username=postgres
spring.datasource.password=3112

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Keycloak Configuration
#spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/civicpulse
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.com.civicpulse.user_service=DEBUG